<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 92 444 328" width="444" height="328">
  <defs>
    <!-- One claw mark: sharp at both ends, widest just above the middle, gently curved. -->
    <path id="claw" d="M 46,-106 C 38,-46 8,24 -46,106 C -30,30 -2,-40 46,-106 Z"/>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#E0A21B"/>
    </linearGradient>
    <radialGradient id="red" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#F0402F"/><stop offset="1" stop-color="#9E111A"/>
    </radialGradient>
  </defs>
  <g transform="translate(256,256)">
    <ellipse rx="222" ry="164" fill="#0B0B0B"/>
    <ellipse rx="208" ry="150" fill="url(#gold)"/>
    <ellipse rx="186" ry="128" fill="#0B0B0B"/>
    <ellipse rx="176" ry="118" fill="url(#red)"/>
    <g fill="#0B0B0B" stroke="#0B0B0B" stroke-width="10" stroke-linejoin="round">
      <use href="#claw" transform="translate(-70,6) scale(0.82)"/>
      <use href="#claw" transform="translate(0,0)"/>
      <use href="#claw" transform="translate(70,-6) scale(0.82)"/>
    </g>
  </g>
</svg>
