<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DBAP</title>
    <meta name="description" content="A winter swim, bike and run plan for triathletes.">
    <meta name="theme-color" content="#0E1A24">

    <!-- Lets iPhone users "Add to Home Screen" and open it like an app, full screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DBAP">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Splash: the DBAP badge for 4 seconds each time the app opens. Plain HTML so it shows instantly. -->
<div id="splash"><img src="badge.png" alt="DBAP"><div class="splash-bar"><div></div></div></div>
<div id="root"></div>
<noscript>DBAP needs JavaScript turned on.</noscript>
<script src="offseason.js"></script>
<script>
    setTimeout(() => {
        const s = document.getElementById('splash');
        s.classList.add('gone');
        setTimeout(() => s.remove(), 500);
    }, 4000);
    // Works offline after the first visit.
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
</script>
</body>
</html>
