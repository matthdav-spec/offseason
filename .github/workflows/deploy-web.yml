# Builds the DBAP web app from main and publishes it to GitHub Pages:
#   https://matthdav-spec.github.io/offseason/
#
# The same build is also published at the two old preview addresses (/dbap/ and /run-preview/) so
# anyone who added those to their Home Screen keeps working, with their own data, as before.
# The engine tests must pass before anything is published.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :engine:jvmTest :web:jsBrowserDistribution

      - name: Put the site together
        run: |
          mkdir site
          cp -r web/build/dist/js/productionExecutable/. site/
          for old in dbap run-preview; do
            mkdir site/$old
            cp -r web/build/dist/js/productionExecutable/. site/$old/
            # Its own offline cache name, so it never clears the main app's cache.
            sed -i "s/const VERSION = 'offseason-/const VERSION = 'offseason-$old-/" site/$old/sw.js
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
